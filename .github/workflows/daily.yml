name: Daily Raleigh scrape

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Discover meetings and parse cases
        run: python3 00_discover_meetings.py

      - name: Geocode new cases
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: python3 01_geocode_new.py

      - name: Check official case status
        continue-on-error: true
        run: python3 04_check_status.py

      - name: Build map
        run: python3 02_build_map.py

      - name: Send email digest for new cases
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: python3 03_send_digest.py

      - name: Notify public subscribers
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          DIGEST_FROM_EMAIL: alerts@raleighdevelopmenttracker.com
          UNSUBSCRIBE_MAILTO: ${{ secrets.DIGEST_TO_EMAIL }}
        run: python3 05_notify_subscribers.py

      - name: Commit and push updated data
        run: |
          git config user.name "raleigh-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/case_store.json data/meetings_seen.json data/meetings_pending.json data/geocode_cache.json data/new_this_run.json data/pipeline.log docs/
          git diff --quiet --cached || git commit -m "Automated update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
